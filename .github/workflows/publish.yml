# Publishes starsinger-mcp to npm with trusted publishing (OIDC): no npm token,
# no two-factor prompt on a laptop. npm side: package Settings → Trusted
# Publisher → GitHub Actions, owner jupiterspins, repo starsinger-mcp, workflow
# publish.yml. Trigger: push a tag like v0.2.1 (or run manually).
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
